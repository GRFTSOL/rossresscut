[package]
name = "rossresscut"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native lossless media cutting tool built with Rust and egui."

[dependencies]
cpal = "0.18"
eframe = { version = "0.37", features = ["persistence"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[lints.rust]
unsafe_code = "forbid"
