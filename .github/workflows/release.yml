name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package:
    name: Linux package (pacman)
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
    steps:
      # actions/checkout needs git, which base-devel does not include.
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: >
          pacman -S --noconfirm --needed
          rust pkgconf ffmpeg mpv alsa-lib libglvnd mesa wayland
          libxkbcommon libxcb

      - name: Check versions
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          pkgver=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          if [[ -z $version || $version != "$pkgver" ]]; then
            echo "error: Cargo.toml version ($version) differs from PKGBUILD pkgver ($pkgver)" >&2
            exit 1
          fi
          if [[ $REF_TYPE == tag && $REF_NAME != "v$version" ]]; then
            echo "error: tag $REF_NAME does not match version v$version" >&2
            exit 1
          fi

      - name: Build binary and package
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          # makepkg refuses to run as root, so build as an unprivileged user.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"

          runuser -u builder -- env HOME=/home/builder \
            cargo build --release --locked

          mkdir -p dist
          chown builder dist
          # --nodeps: runtime dependencies are declared in the package, they are
          # not needed to assemble it. The binary was built above, so the
          # PKGBUILD build() only verifies it exists.
          runuser -u builder -- env \
            HOME=/home/builder \
            PKGEXT=.pkg.tar.zst \
            PKGDEST="$GITHUB_WORKSPACE/dist" \
            bash -c 'cd packaging && makepkg --force --nodeps'

          (cd dist && sha256sum *.pkg.tar.zst > SHA256SUMS)
          ls -l dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
          if-no-files-found: error

  attach-to-release:
    name: Attach package to the release
    needs: linux-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-package
          path: dist

      # The release is usually created from the git tag before or after this
      # run. Upload only when it exists, so a tag push never creates an empty
      # release page.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG does not exist yet; the package stays in the workflow artifacts" >&2
            exit 0
          fi
          gh release upload "$TAG" dist/* --clobber

  windows-package:
    name: Windows portable package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up the MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        shell: bash
        run: rustup show

      - name: Check version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ $REF_NAME != "v$version" ]]; then
            echo "error: tag $REF_NAME does not match version v$version" >&2
            exit 1
          fi

      - name: Fetch libmpv and FFmpeg
        shell: bash
        env:
          # Pinned so a released package cannot change underneath the tag.
          MPV_BUILD_TAG: 2026-11-23-1eb941fdb9
          MPV_DEV_ARCHIVE: mpv-dev-x86_64-20261123-git-1eb941fdb9.7z
          MPV_DEV_SHA256: ef1ef7d2b405d2fb9defa9e6c3347e80ac8566190a37f85f0b4831988ed2c61a
          # zhongfly's ffmpeg archive ships ffmpeg.exe only, so FFmpeg comes
          # from the full BtbN build instead.
          FFMPEG_BUILD_TAG: autobuild-2026-11-23-12-43
          FFMPEG_ARCHIVE: ffmpeg-N-129241-g05c674c913-win64-gpl.zip
          FFMPEG_SHA256: 694e2e119adff51b6c7b7db260173760ea308f343cbff88c04883dba7a8b1a1c
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/zhongfly/mpv-winbuild/releases/download/$MPV_BUILD_TAG/$MPV_DEV_ARCHIVE" \
            -o "$MPV_DEV_ARCHIVE"
          curl -sSfL \
            "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$FFMPEG_BUILD_TAG/$FFMPEG_ARCHIVE" \
            -o "$FFMPEG_ARCHIVE"
          check_sum() {
            local file=$1 expected=$2 actual
            actual=$(sha256sum "$file" | cut -d' ' -f1)
            if [[ $actual != "$expected" ]]; then
              echo "error: $file checksum mismatch" >&2
              exit 1
            fi
          }
          check_sum "$MPV_DEV_ARCHIVE" "$MPV_DEV_SHA256"
          check_sum "$FFMPEG_ARCHIVE" "$FFMPEG_SHA256"
          7z x -y "$MPV_DEV_ARCHIVE" -odeps/mpv > /dev/null
          7z x -y "$FFMPEG_ARCHIVE" -odeps/ffmpeg > /dev/null
          for name in libmpv-2.dll ffmpeg.exe ffprobe.exe; do
            if ! find deps -name "$name" -print -quit | grep -q .; then
              echo "error: $name is missing from the downloaded archives" >&2
              exit 1
            fi
          done

      - name: Generate the import library
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/mpv-import-lib.sh "$(find deps/mpv -name libmpv-2.dll | head -1)" dist/mpv-lib

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          # rustc and the MSVC linker need a native Windows path; the shell
          # tools below accept the MSYS paths that `find` returns.
          export MPV_LIBRARY_DIR=$(cygpath -w "$PWD/dist/mpv-lib")
          export MPV_DLL=$(find deps/mpv -name libmpv-2.dll | head -1)
          export FFMPEG_BIN=$(find deps/ffmpeg -name ffmpeg.exe | head -1)
          export FFPROBE_BIN=$(find deps/ffmpeg -name ffprobe.exe | head -1)
          ./scripts/package-windows.sh

      - name: Upload the package artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            dist/*windows-x64.zip
            dist/*windows-x64.zip.sha256
          if-no-files-found: error

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG does not exist yet; the package stays in the workflow artifacts" >&2
            exit 0
          fi
          gh release upload "$TAG" dist/*windows-x64.zip dist/*windows-x64.zip.sha256 --clobber
